<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="Cavora Systems">
  <title>Cavora Systems</title>
  <defs>
    <linearGradient id="gGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#A88940"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#122F24"/>
    </linearGradient>
  </defs>

  <!-- Main outer C ring (R 150→118, 250° arc, gap ±55°) -->
  <path fill="url(#gGold)"
    d="M326 307.9 A150 150 0 1 1 326 62.1 L307.7 88.3 A118 118 0 1 0 307.7 281.7 Z"/>

  <!-- Green band (R 118→103) -->
  <path fill="url(#gGreen)"
    d="M307.7 281.7 A118 118 0 1 1 307.7 88.3 L299.1 100.6 A103 103 0 1 0 299.1 269.4 Z"/>

  <!-- Inner gold C (R 103→88) -->
  <path fill="url(#gGold)"
    d="M299.1 269.4 A103 103 0 1 1 299.1 100.6 L290.5 112.9 A88 88 0 1 0 290.5 257.1 Z"/>

  <!-- Right arc segment — top (319°→341°) -->
  <path fill="url(#gGold)"
    d="M353.2 86.6 A150 150 0 0 1 381.8 136.2 L351.6 146.6 A118 118 0 0 0 329.1 107.6 Z"/>

  <!-- Right arc segment — middle (349°→11°, points exactly right) -->
  <path fill="url(#gGold)"
    d="M387.2 156.4 A150 150 0 0 1 387.2 213.6 L355.8 207.5 A118 118 0 0 0 355.8 162.5 Z"/>

  <!-- Right arc segment — bottom (19°→41°) -->
  <path fill="url(#gGold)"
    d="M381.8 233.8 A150 150 0 0 1 353.2 283.4 L329.1 262.4 A118 118 0 0 0 351.6 223.4 Z"/>

  <!-- CAVORA wordmark -->
  <text x="240" y="390"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="52" font-weight="300" fill="#C9A96E"
    text-anchor="middle" style="letter-spacing:0.27em">CAVORA</text>

  <!-- Decorative rules flanking SYSTEMS -->
  <line x1="95"  y1="406" x2="162" y2="406" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/>
  <line x1="318" y1="406" x2="385" y2="406" stroke="#C9A96E" stroke-width="0.8" opacity="0.4"/>

  <!-- SYSTEMS wordmark -->
  <text x="240" y="424"
    font-family="'Inter', system-ui, sans-serif"
    font-size="13" font-weight="400" fill="#2D6A4F"
    text-anchor="middle" style="letter-spacing:0.46em">SYSTEMS</text>
</svg>
